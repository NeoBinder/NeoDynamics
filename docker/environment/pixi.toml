[workspace]
name = "neodynamics-runtime"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = "==2.5.2"
pip = "*"
openmm = "8.6.*"
# OpenMM compiles CUDA kernels at runtime. Keep NVRTC within this driver tier.
cuda-version = "13.2.*"
openmmforcefields = ">=0.16,<0.17"
openff-toolkit = ">=0.19,<0.20"
pdbfixer = "==1.12.0"
gemmi = ">=0.7.5,<0.8"
httpx = ">=0.28,<1"

[pypi-dependencies]
python-box = ">=7.3.2"
asyncpg = ">=0.31,<0.32"
jsonschema = ">=4.26,<5"
rfc8785 = ">=0.1.4,<1"
fastapi = ">=0.116,<1"
uvicorn = ">=0.35,<1"
websockets = ">=15,<17"
