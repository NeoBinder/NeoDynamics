name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hosted runners have no CUDA device. Keep CPU/fake and golden coverage active.
env:
  PYTEST_ADDOPTS: "--skip-cuda"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CPU-only, single-threaded for reproducible golden-sample comparisons
      OPENMM_CPU_THREADS: "1"
    steps:
      # full history + tags: the version comes from versioningit off git
      # tags; the default shallow checkout has none and the editable build
      # of NeoDynamics fails with "could not find a version"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The locked `test` environment carries the engine and preparation test
      # dependencies; the resident service and its database tests live in the
      # NeomdServer repository.
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.77.1
          environments: test
          locked: true
          cache: true

      - name: Run tests (excluding golden)
        run: pixi run -e test python -m pytest tests/ -m 'not golden and not legacy'

      - name: Run golden-sample tests
        run: pixi run -e test python -m pytest tests/ -m 'golden and not legacy'
        env:
          # The tapes are bit-stable only on the microarchitecture that
          # recorded them; the hosted runner fleet is heterogeneous, and
          # float summation order flips the last printed digit of the total
          # energy (~1e-8 relative). The statistical tier keeps every
          # numeric bound (max 1e-3, mean 1e-4 kJ/mol) and drops only
          # string/bit-identity and coordinate-frame hashes.
          NEO_GOLDEN_TOLERANT: "1"

  # 3HTB end-to-end smoke under neomd (migration plan §5 item 3.2).
  #
  # antechamber/parmchk2 are REQUIRED for the GAFF ligand leg. They are NOT a
  # separate install: openff-toolkit depends on ambertools, so every locked
  # pixi environment (default/test/dev) already ships ambertools 26.0 from
  # conda-forge — no extra feature, no fresh solve, `locked: true` covers it.
  # The module also carries a skipif(shutil.which("antechamber")) guard for
  # hand-rolled environments without it.
  #
  # The `test` environment (not `default`) is installed because the module
  # lives next to pdbfixer-dependent siblings; like `default` it is part of
  # the committed lock's default solve-group, so this stays a locked install.
  smoke-3htb:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # consistent with the test job; the smoke's MD legs pin their own fixed
      # thread count inside their subprocess (see tests/v2/test_3htb_e2e.py)
      OPENMM_CPU_THREADS: "1"
    steps:
      # full history + tags for versioningit, same as the `test` job
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.77.1
          environments: test
          locked: true
          cache: true

      - name: Run the 3HTB end-to-end smoke
        run: pixi run -e test pytest tests/v2/test_3htb_e2e.py -v -m 'not golden'
