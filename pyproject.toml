[build-system]
requires = ["setuptools", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "NeoDynamics"
authors = [
  { name="Yilang Hu" },
  { name = "Xinhao Han" }
]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "python-box >= 7.3.2",
]

[project.scripts]
neomd = "neomd.cli:main"
neomd2 = "neomd.cli:main"  # strangler-period alias, removed with neomd_legacy


[tool.versioningit]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/NeoBinder/NeoDynamics"
Issues = "https://github.com/NeoBinder/NeoDynamics/issues"

[tool.pytest.ini_options]
markers = [
  "golden: golden-sample parity tests against v1 tapes (run via `pixi run test-golden`)",
  "legacy: tests exercising frozen v1 (neomd_legacy) live; excluded from CI after the flip (run via `pixi run test-legacy`)",
]

[tool.ruff]
# The project's first lint gate (issue #13 residue): check-only, conservative,
# no churn to physics code (AGENTS.md settled decision #2 — force expressions
# are ported verbatim and are not to be "cleaned up").
extend-exclude = [
  "src/neomd_legacy", # frozen v1 — bug fixes only, never lint-churned
  "bin",              # frozen v1 wrappers + standalone v1 analysis tools
  "examples",         # separate mini-projects (gamd_drill has its own pyproject)
  "docs",
  ".worktrees",       # in-repo worktrees carry their own pyproject.toml copies
]
# pre-commit passes excluded paths explicitly (it appends filenames to the
# ruff invocation); without this flag ruff would lint them anyway and the
# hook would fail on frozen v1 code.
force-exclude = true
line-length = 100

[tool.ruff.lint]
# Ruff's default set (pyflakes + the pycodestyle subsets that are safe:
# E4 import formatting errors, E7 statement errors, E9 runtime errors) plus
# isort (I) for deterministic import ordering. E501 and style-opinion rules
# are deliberately NOT enabled — this gate must stay mechanical.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["neomd", "neomd_legacy"]
