[build-system]
requires = ["setuptools", "versioningit"]
build-backend = "setuptools.build_meta"

[project]
name = "NeoDynamics"
authors = [
  { name="Yilang Hu" },
  { name = "Xinhao Han" }
]
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "python-box >= 7.3.2",
  "numpy >= 2.0",
  "openmm >= 8.6,<8.7",
  "rfc8785 >= 0.1.4,<1",
  "jsonschema >= 4.26,<5",
  "PyYAML >= 6.0",
]

[project.optional-dependencies]
# Component chemistry (ligand/SEP/assembly providers). The in-repo
# `neomd_preparation` package imports these lazily; runtime-only installs do
# not need the toolkit stack.
component = [
  "openff-toolkit >= 0.19,<0.20",
  "rdkit >= 2024.9",
  "networkx >= 3.0",
  "lxml >= 5.0",
  "parmed >= 4.0",
]
# Protein/system preparation: PDBFixer repairs, Gemmi structure IO and the
# OpenFF/OpenMM force-field generators used by preparation and assembly.
preparation = [
  "openmmforcefields >= 0.16,<0.17",
  "pdbfixer >= 1.12",
  "gemmi >= 0.7.5,<0.8",
]
# Alchemical free-energy tooling (ADR-0003/ADR-0007).
rbfe = [
  "openmmtools == 0.26.*",
]
# Torch-backed ML/MM and ML-CV kernels. openmm-torch is only distributed on
# conda-forge, so the pixi environment owns that pin; the PyPI extra carries
# torch itself for tests that import it. The extra is named apart from the
# pixi `ml` feature so pixi never injects torch into that environment.
mlmm = [
  "torch >= 2.0",
]

[project.scripts]
neomd = "neomd.cli:main"
neomd2 = "neomd.cli:main"  # strangler-period alias, removed with neomd_legacy

[tool.versioningit]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/neodynamics/contracts/prepared-bundle/v1" = ["contracts/prepared-bundle/v1/*.json"]
"share/neodynamics/contracts/prepared-bundle/v2" = ["contracts/prepared-bundle/v2/*.json"]
"share/neodynamics/contracts/assembly-report/v1" = ["contracts/assembly-report/v1/*.json"]
"share/neodynamics/contracts/molecular-topology/v1" = ["contracts/molecular-topology/v1/*.json"]
"share/neodynamics/contracts/component-preparation/v1" = ["contracts/component-preparation/v1/*.schema.json"]
"share/neodynamics/contracts/component-system-qc/v1" = ["contracts/component-system-qc/v1/*.schema.json"]

[project.urls]
Homepage = "https://github.com/NeoBinder/NeoDynamics"
Issues = "https://github.com/NeoBinder/NeoDynamics/issues"

[tool.pytest.ini_options]
markers = [
  "cuda: requires CUDA execution (including the default OpenMM platform); skipped by --skip-cuda",
  "golden: golden-sample parity tests against v1 tapes (run via `pixi run test-golden`)",
  "legacy: tests exercising frozen v1 (neomd_legacy) live; excluded from CI after the flip (run via `pixi run test-legacy`)",
]

[tool.ruff]
extend-exclude = [
  "src/neomd_legacy", # frozen v1 — bug fixes only, never lint-churned
  "bin",              # frozen v1 wrappers + standalone v1 analysis tools
  "examples",         # separate mini-projects (gamd_drill has its own pyproject)
  "docs",
  ".worktrees",       # in-repo worktrees carry their own pyproject.toml copies
]
force-exclude = true # pre-commit passes excluded paths explicitly
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["neomd", "neomd_legacy", "neomd_preparation"]

[tool.ruff.lint.per-file-ignores]
# Stable lazy facades: the historical names are exported through module
# __getattr__ and imported from the preparation distribution on first access.
"src/neomd/integration.py" = ["F822"]
"src/neomd/system.py" = ["F822"]

# --- pixi workspace (merged from pixi.toml) ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
python-box = ">=7.3.2"
numpy = "*"

[tool.pixi.pypi-options]
index-url = "https://pypi.org/simple"

[tool.pixi.dependencies]
python = "3.12.*"

# The engine stack lives in a FEATURE so the ml environment can carry its own
# openmm pin (ADR-0004) without intersecting a workspace-level 8.6.*.
# The editable engine install belongs to this feature, not the workspace: the
# `ml` environment pins openmm 8.5.* (ADR-0004) and cannot satisfy the
# engine's own `openmm>=8.6` requirement, so it runs from PYTHONPATH instead.
[tool.pixi.feature.engine.pypi-dependencies]
NeoDynamics = { path = ".", editable = true }

[tool.pixi.feature.engine.dependencies]
openmm = "8.6.*"
openmmforcefields = ">=0.16,<0.17"
openff-toolkit = ">=0.19,<0.20"
gemmi = ">=0.7.5,<0.8"
pytest = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
jsonschema = ">=4.26,<5"
pdbfixer = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs-material = "*"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-gen = "python docs/generate_reference.py"

# rbfe: openmmtools 0.26 (conda-forge, MIT), the line audited against the
# openmm 8.6.x pin (ADR-0003/ADR-0007, decision #10). Separate solve-group.
[tool.pixi.feature.rbfe.dependencies]
openmmtools = "0.26.*"

# dev: extra environment for bin/hills_ana.py (mdtraj + MDAnalysis)
[tool.pixi.feature.dev.dependencies]
mdtraj = "*"
pandas = "*"
mdanalysis = "*"

# ml (ADR-0004): every conda-forge openmm-torch build (1.5.1) caps
# openmm < 8.6, so this environment carries a temporary openmm 8.5.* pin;
# upgrade to 8.6.* when a tracking build lands (decision #10 event).
# Separate solve-group: the pin must never leak into default/test/dev.
# Real-torch tests are importorskip-gated and run here:
#   pixi run -e ml test-ml
[tool.pixi.feature.ml.dependencies]
openmm = "8.5.*"
openmm-torch = "1.5.*"
pytorch = "2.12.*"
openff-toolkit = ">=0.19,<0.20"
openmmforcefields = ">=0.16,<0.17" # the tools.ligand workflow (demo prepare)
ambertools = "*"                   # the demo's GAFF ligand parameterization stage
pytest = "*"
# The engine is not pip-installed here (openmm pin mismatch above), so the
# ml environment needs the engine's core runtime requirements explicitly,
# including the workspace defaults it does not inherit.
python = "3.12.*"
python-box = "*"
jsonschema = ">=4.26,<5"
pyyaml = "*"

[tool.pixi.feature.ml.pypi-dependencies]
rfc8785 = ">=0.1.4,<1"

[tool.pixi.feature.ml.tasks]
test-ml = { cmd = "pytest tests/v2/test_mlmm.py -v", env = { PYTHONPATH = "src" } }

[tool.pixi.environments]
default = { features = ["engine"], solve-group = "default" }
test = { features = ["engine", "test"], solve-group = "default" }
dev = { features = ["engine", "dev"], solve-group = "dev" }
docs = { features = ["engine", "docs"], solve-group = "default" }
ml = { features = ["ml"], solve-group = "ml", no-default-feature = true }
# the rbfe env's gate: the default tier (import-gated tests skip there) plus
# the openmmtools-gated alchemy smoke (tests/v2/test_rbfe_alchemy.py)
rbfe = { features = ["engine", "rbfe", "test"], solve-group = "rbfe" }

[tool.pixi.tasks]
test = "pytest tests/ -m 'not golden and not legacy'"
test-golden = "pytest tests/ -m 'golden and not legacy'"
test-legacy = "pytest tests/ -m legacy -q"
test-rbfe = "pytest tests/ -m 'not golden and not legacy'"
