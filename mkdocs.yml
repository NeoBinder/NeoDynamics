# Mkdocs configuration for the NeoDynamics documentation site (issue #17).
#
# Build locally with `pixi run docs-build` (strict: warnings fail the build);
# the site deploys to GitHub Pages from main via .github/workflows/docs.yml.
# docs/reference/configuration.md is GENERATED by `pixi run docs-gen`
# (docs/generate_reference.py) — never edit it by hand.
site_name: NeoDynamics
site_description: >-
  A molecular-dynamics SDK on OpenMM — generic MD, well-tempered
  metadynamics and steered MD behind a single facade, with a swappable
  physics kernel.
site_url: https://neobinder.github.io/NeoDynamics/
repo_url: https://github.com/NeoBinder/NeoDynamics
repo_name: NeoBinder/NeoDynamics

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

# the reference generator is tooling, not site content;
# __pycache__ appears when the sync test imports the generator in-place
exclude_docs: |
  generate_reference.py
  __pycache__

nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Configuration reference: reference/configuration.md
  - Architecture: architecture.md
  - Tutorials:
      - Metadynamics: tutorials/metadynamics.md
      - Steered MD: tutorials/steered-md.md
      - Restraints: tutorials/restraints.md
      - Coming soon: tutorials/coming-soon.md
  - Methods:
      - Overview: methods/index.md
      - GaMD: methods/gamd.md
      - ML/MM: methods/mlmm.md
      - OPES: methods/opes.md
      - RBFE: methods/rbfe.md
      - Boresch restraint: methods/boresch.md
      - CV library: methods/cv-library.md
      - ML-CV: methods/mlcv.md
      - Analysis: methods/analysis.md
      - QC: methods/qc.md
  - Development:
      - Overview: development.md
      - ADR 0001 — same-repo strangler migration: adr/0001-neomd2-strangler-migration.md
