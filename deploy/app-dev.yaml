# api-dev only. Replace the registry.example image with the verified registry @sha256 digest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neodynamics-data
  namespace: api-dev
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 300Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neodynamics
  namespace: api-dev
  labels:
    app: neodynamics
    component: resident-md
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neodynamics
      component: resident-md
  template:
    metadata:
      labels:
        app: neodynamics
        component: resident-md
    spec:
      runtimeClassName: nvidia
      # Pin to the time-sliced GPU node; the resident readiness gate
      # requires qualification=cuda and the pod failed that on rke-node1.
      nodeSelector:
        kubernetes.io/hostname: kube-gpu
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: server
        image: registry.example/neodynamics:dev
        imagePullPolicy: Always
        args:
        - serve
        ports:
        - name: http
          containerPort: 8003
        envFrom:
        - configMapRef:
            name: neodynamics-runtime-config
        env:
        - name: NEOMD_SERVER_PG_DSN
          valueFrom:
            secretKeyRef:
              name: neodynamics-runtime-secret
              key: NEOMD_SERVER_PG_DSN
        resources:
          # Match the qualified live api-dev pod profile. The 8 GiB ceiling
          # leaves headroom around the 4 GiB isolated preparation child.
          requests:
            cpu: '2'
            memory: 4Gi
            ephemeral-storage: 1Gi
            nvidia.com/gpu: 1
          limits:
            cpu: '8'
            memory: 8Gi
            ephemeral-storage: 4Gi
            nvidia.com/gpu: 1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/neodynamics
        - name: md-publication-auth
          mountPath: /var/run/md-publication
          readOnly: true
        - name: service-auth
          mountPath: /var/run/neodynamics-auth
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /home/neomd
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import datetime, json, os, pathlib, sys, urllib.request
              try:
                  token = pathlib.Path(os.environ["NEOMD_SERVER_TOKEN_FILE"]).read_text().removesuffix("\n")
                  request = urllib.request.Request(
                      "http://127.0.0.1:8003/internal/md/v1/capabilities",
                      headers={"Authorization": "Bearer " + token,
                               "X-Neomd-Scope": "00000000-0000-4000-8000-000000000001"})
                  opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
                  with opener.open(request, timeout=3) as response:
                      raw = response.read(1048577)
                      if response.status != 200 or len(raw) > 1048576:
                          sys.exit(1)
                  data = json.loads(raw)
                  fresh_until = datetime.datetime.fromisoformat(data["fresh_until"].replace("Z", "+00:00"))
                  expected = {"min", "eq", "md", "prod", "metadynamics", "smd", "opes", "gamd", "rbfe"}
                  methods = data["methods"]
                  ready = (data["freshness"] == "fresh"
                           and fresh_until > datetime.datetime.now(datetime.timezone.utc)
                           and len(methods) == len(expected)
                           and {item["method"] for item in methods} == expected
                           and all(item["availability"] == "available"
                                   and item["qualification"] == "cuda" for item in methods))
                  sys.exit(0 if ready else 1)
              except Exception:
                  sys.exit(1)
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: neodynamics-data
      - name: md-publication-auth
        secret:
          secretName: md-publication-auth
          defaultMode: 288
          items:
          - key: token
            path: token
      - name: service-auth
        secret:
          secretName: neodynamics-runtime-secret
          defaultMode: 288
          items:
          - key: service-token
            path: service-token
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: home
        emptyDir:
          sizeLimit: 1Gi
      imagePullSecrets:
      - name: harbor-robot-pull
---
apiVersion: v1
kind: Service
metadata:
  name: neodynamics-service
  namespace: api-dev
spec:
  type: ClusterIP
  selector:
    app: neodynamics
    component: resident-md
  ports:
  - name: http
    port: 8003
    targetPort: http
