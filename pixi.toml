
[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[pypi-dependencies]
NeoDynamics = { path = ".", editable = true }
python-box = ">=7.3.2"
numpy = "*"

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "dev" }
docs = { features = ["docs"], solve-group = "default" }

[tasks]
test = "pytest tests/ -m 'not golden and not legacy'"
test-golden = "pytest tests/ -m 'golden and not legacy'"
test-legacy = "pytest tests/ -m legacy -q"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[dependencies]
python = "3.12.*"
openmm = "8.6.*"
openmmforcefields = ">=0.16,<0.17"
openff-toolkit = ">=0.19,<0.20"
pytest = "*"

# docs site (issue #17): the docs environment carries mkdocs-material on top
# of the default features (the package itself included — docs-gen introspects
# the live registry vocabularies). The two tasks live in the feature so
# `pixi run docs-build` / `pixi run docs-gen` auto-select the docs environment.
[feature.docs.dependencies]
mkdocs-material = "*"

[feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-gen = "python docs/generate_reference.py"

[feature.test.dependencies]
pytest = "*"
pdbfixer = "*"

# dev: extra environment for bin/hills_ana.py (mdtraj + MDAnalysis + local NeoTopology/ttk)
[feature.dev.dependencies]
mdtraj = "*"
pandas = "*"
mdanalysis = "*"

[feature.dev.pypi-dependencies]
NeoTopology = { path = "../NeoTopology", editable = true }
