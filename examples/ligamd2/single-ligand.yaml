# Replace paths and ALL index lists using your prepared-System topology mapping.
# The displayed indices are illustrative, never automatically inferred.
method: gamd
steps:
  unbiased_eq: 1000
  unbiased_production: 10000
  biased_eq: 1000
  biased_eq2: 10000
  production: 978000
temperature: 300
seed: 2026
integrator: {dt: 0.002, friction_coeff: 1.0}
input_files:
  complex: prepared/complex.pdbx
  system: prepared/system.xml
output:
  output_dir: run-ligamd2
  trajectory_interval: 200
  state_interval: 1000
  checkpoint_interval: 1000
  gamd:                  # GaMD's own output detail (ADR-0011)
    sample_interval: 100 # equilibration V(P) statistics cadence
    trace_interval: 200  # production tape cadence
gamd:
  energy_unit: kcal/mol
  boosts:
    - label: ligand_pocket
      sigma0: 9.0
      threshold_policy: upper
      selectors:
        # Default include_boundary: internal bond/angle/dihedral terms join this
        # boost, crossing pocket-boundary bonded terms stay out and fall to
        # `remaining`; every nonbonded pair with one listed atom joins here.
        # Add `include_boundary: {bond: true, angle: true, dihedral: true}` to
        # include the crossing bonded terms instead.
        - atom_indices: [0, 1, 2, 3, 4, 5]
          force_types: all
        - atom_indices: [10, 11, 12, 13, 14, 15]
          force_types: all
    - label: remaining
      remaining: true
      sigma0: 6.0
      threshold_policy: lower
