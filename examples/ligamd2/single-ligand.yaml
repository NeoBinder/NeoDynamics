# Replace paths and ALL index lists using your prepared-System topology mapping.
# The displayed indices are illustrative, never automatically inferred.
method: gamd
steps: 1000000
temperature: 300
seed: 2026
integrator: {dt: 0.002, friction_coeff: 1.0}
input_files:
  complex: prepared/complex.pdbx
  system: prepared/system.xml
output:
  output_dir: run-ligamd2
  trajectory_interval: 200
  state_interval: 1000
  checkpoint_interval: 1000
gamd:
  preparation_steps: 1000
  calibration_steps: 10000
  calibration_interval: 100
  boost_preparation_steps: 1000
  equilibration_steps: 10000
  adaptation_interval: 100
  energy_unit: kcal/mol
  frequency: 200
  boosts:
    - label: ligand_pocket
      sigma0: 9.0
      threshold_policy: upper
      selectors:
        - atom_indices: [0, 1, 2, 3, 4, 5]
          force_types: [bond, angle, dihedral, nonbonded]
        - atom_indices: [10, 11, 12, 13, 14, 15]
          force_types: [bond, angle, dihedral, nonbonded]
    - label: remaining
      remaining: true
      sigma0: 6.0
      threshold_policy: lower
