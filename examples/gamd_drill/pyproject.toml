# The GAMD plugin drill (v2 migration plan §5 item 2.9, §2 Non-Goals).
#
# A standalone mini package that lives OUTSIDE src/neomd/ on purpose: its
# only job is to prove that a third-party distribution can register a
# "method" knowledge triple and be discovered through the importlib.metadata
# entry-point group "neomd" (neomd.registry.scan_entry_points).  The
# physics is a placeholder — this is a drill, not GAMD.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neomd-gamd-drill"
version = "0.0.1"
description = "GAMD plugin drill: validates the neomd extension rack from outside the core package"
requires-python = ">=3.12"
dependencies = ["neomd"]  # the plugin host; a real install would pin a version

# The extension-rack contract: every entry point in group "neomd" names a
# module whose import self-registers via neomd.registry.register.
# scan_entry_points() loads it; the driver dispatches registry.get("method", name).
[project.entry-points."neomd"]
gamd_drill = "neomd_gamd_drill"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
